<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>love test ♥</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="css/site.css">
  <style>
    @keyframes ltRainbow { to { background-position: 200% center; } }
    @keyframes ltSweep   { to { background-position: -140% 0; } }
    @keyframes ltShake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-5px); }
      40%,80% { transform: translateX(5px); }
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(.6); }
      100% { opacity: 0; transform: translateY(-160px) scale(1.3); }
    }
    /* a heartbeat for the hearts */
    @keyframes ltBeat {
      0%,100% { transform: scale(1); }
      15%     { transform: scale(1.35); }
      30%     { transform: scale(1.05); }
      45%     { transform: scale(1.25); }
      60%     { transform: scale(1); }
    }
    /* the whole machine frame cycles through the rainbow */
    @keyframes ltFrame {
      0%   { border-color:#ff5c8a; box-shadow: 0 0 18px #ff0000 inset, 0 0 12px rgba(255,0,0,.6); }
      25%  { border-color:#ffee00; box-shadow: 0 0 18px #ffee00 inset, 0 0 12px rgba(255,238,0,.6); }
      50%  { border-color:#33ff00; box-shadow: 0 0 18px #33ff00 inset, 0 0 12px rgba(51,255,0,.6); }
      75%  { border-color:#00ffee; box-shadow: 0 0 18px #00ffee inset, 0 0 12px rgba(0,255,238,.6); }
      100% { border-color:#ff5c8a; box-shadow: 0 0 18px #ff0000 inset, 0 0 12px rgba(255,0,0,.6); }
    }
    @keyframes ltBtnPulse {
      0%,100% { box-shadow: 0 0 6px #ff00ff; }
      50%     { box-shadow: 0 0 16px #00ffff; }
    }

    /* ── love test ─────────────────────────────────────── */
    .lovetest { text-align: center; }

    .lovetest .lt-machine {
      max-width: 380px;
      margin: 0 auto;
      border: 3px ridge #ff5c8a;
      background: #10002e;
      background-image:
        radial-gradient(rgba(255,0,255,.14) 1px, transparent 1px),
        radial-gradient(rgba(0,255,255,.14) 1px, transparent 1px);
      background-size: 14px 14px;
      background-position: 0 0, 7px 7px;
      padding: 16px 16px 20px;
      box-shadow: 0 0 18px #ff00ff inset;
    }

    .lovetest .lt-title {
      font-family: "Courier New", "Arial Black", sans-serif;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 12px;
      background: linear-gradient(90deg,#ff0000,#ff9900,#ffee00,#33ff00,#00ffee,#3300ff,#ff00ee);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 5px rgba(255,255,255,.35));
    }

    .lovetest label {
      display: block;
      text-align: left;
      font-family: "Courier New", monospace;
      color: #ffb3d1;
      font-size: 13px;
      letter-spacing: 1px;
      margin: 10px 0 3px;
    }
    .lovetest input[type="text"] {
      width: 100%;
      background: #000;
      color: #ff8ac2;
      border: 2px inset #ff00ff;
      font-family: "Courier New", monospace;
      font-size: 16px;              /* 16px min stops mobile zoom */
      padding: 7px;
      text-shadow: 0 0 4px #ff5c8a;
      transition: box-shadow .2s, border-color .2s;
    }
    .lovetest input[type="text"]:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 12px #ff00ff;
    }
    .lovetest input.shake { animation: ltShake .35s; border-color: #fff; }

    .lovetest .lt-btn {
      margin-top: 16px;
      width: 100%;
      background: linear-gradient(to bottom, #ff00ff, #9900cc);
      color: #fff;
      border: 2px outset #ff00ff;
      font-family: "Comic Sans MS", cursive;
      font-weight: bold;
      font-size: 16px;
      padding: 10px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .lovetest .lt-btn:hover { filter: brightness(1.15); }
    .lovetest .lt-btn:active { border-style: inset; }
    .lovetest .lt-btn:disabled { cursor: wait; filter: grayscale(.3) brightness(.9); }

    .lovetest .lt-note {
      font-family: "Courier New", monospace;
      font-size: 12px; color: #ff5c8a; letter-spacing: 1px;
      min-height: 16px; margin-top: 8px;
    }

    /* meter — alive even before you press the button */
    .lovetest .lt-meter-wrap {
      margin: 16px auto 6px;
      border: 2px inset #ff00ff;
      background: #0a0022;
      background-image:
        radial-gradient(rgba(255,0,255,.18) 1px, transparent 1px),
        radial-gradient(rgba(0,255,255,.18) 1px, transparent 1px);
      background-size: 12px 12px;
      background-position: 0 0, 6px 6px;
      height: 28px;
      overflow: hidden;
      position: relative;
    }
    .lovetest .lt-meter-wrap::before {
      content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(115deg,
        transparent 18%,
        rgba(255,0,0,.20), rgba(255,153,0,.20), rgba(255,238,0,.20),
        rgba(51,255,0,.20), rgba(0,255,238,.20), rgba(51,0,255,.20), rgba(255,0,238,.20),
        transparent 82%);
      background-size: 280% 100%; background-position: 140% 0;
      mix-blend-mode: screen;
    }
    .lovetest .lt-meter {
      position: relative; z-index: 1;
      height: 100%; width: 0%;
      background: linear-gradient(90deg,#ff0000,#ff9900,#ffee00,#33ff00,#00ffee,#3300ff,#ff00ee);
      background-size: 200% auto;
      box-shadow: 0 0 10px rgba(255,255,255,.4);
      transition: width .05s linear;
    }

    .lovetest .lt-pct {
      font-family: "Courier New", "Arial Black", sans-serif;
      font-size: 44px; font-weight: bold;
      margin: 4px 0; min-height: 50px; letter-spacing: 1px;
      background: linear-gradient(90deg,#ff0000,#ff9900,#ffee00,#33ff00,#00ffee,#3300ff,#ff00ee);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.4));
    }

    /* rainbow, beating hearts */
    .lovetest .lt-hearts { font-size: 22px; letter-spacing: 3px; min-height: 28px; }
    .lovetest .lt-hearts .on {
      display: inline-block;
      background: linear-gradient(90deg,#ff0000,#ff9900,#ffee00,#33ff00,#00ffee,#3300ff,#ff00ee);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.55));
    }
    .lovetest .lt-hearts .off { display: inline-block; color: #4a2a5a; }

    .lovetest .lt-share { display: none; margin: 14px auto 0; max-width: 340px; }
    .lovetest .lt-share.on { display: block; }
    .lovetest .lt-share code {
      display: block; background: #000; border: 1px dashed #ff5c8a;
      color: #ffb3d1; font-size: 12px; padding: 6px 8px; word-break: break-word;
    }
    .lovetest .lt-actions {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;
    }
    .lovetest .lt-copy, .lovetest .lt-send {
      background: none; font-family: "Courier New", monospace;
      padding: 5px 12px; cursor: pointer; text-decoration: none; display: inline-block;
    }
    .lovetest .lt-copy { border: 1px solid #ff5c8a; color: #ff5c8a; }
    .lovetest .lt-copy:hover { background: #ff5c8a; color: #10002e; }
    .lovetest .lt-send { border: 1px solid #00ffff; color: #00ffff; }
    .lovetest .lt-send:hover { background: #00ffff; color: #10002e; }

    /* floating hearts on reveal */
    .lovetest .lt-stage { position: relative; }
    .float-heart {
      position: absolute; bottom: 0; font-size: 20px; pointer-events: none;
      animation: floatUp 1.8s ease-out forwards;
    }

    /* all the motion, only when the visitor hasn't asked us to calm down */
    @media (prefers-reduced-motion: no-preference) {
      .lovetest .lt-title,
      .lovetest .lt-pct        { animation: ltRainbow 6s linear infinite; }
      .lovetest .lt-meter      { animation: ltRainbow 4s linear infinite; }
      .lovetest .lt-meter-wrap::before { animation: ltSweep 4s linear infinite; }
      .lovetest .lt-machine    { animation: ltFrame 6s linear infinite; }
      .lovetest .lt-btn        { animation: ltBtnPulse 2.6s ease-in-out infinite; }
      .lovetest .lt-hearts .on { animation: ltRainbow 3s linear infinite, ltBeat 1.3s ease-in-out infinite; }
    }
  </style>
</head>
<body>

  <div class="ticker"><span>✦ results are unquestionable ✦</span></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>

    <div class="frame">

      <div class="hero">
        <h1>✧ the love tester ✧</h1>
        <p class="blink">☆ ♥ 100% accurate no problem ♥ ☆</p>
      </div>

      <div class="divider">★ ° ☆ ° ★ ° ☆ ° ★</div>

      <div class="content lovetest">

        <div class="lt-stage">
          <div class="lt-machine">
            <div class="lt-title">♥ THE love tester 2.0 ♥</div>

            <label for="ltA">name</label>
            <input type="text" id="ltA" maxlength="60" autocomplete="off" placeholder="★ lover one">

            <label for="ltB"> name</label>
            <input type="text" id="ltB" maxlength="60" autocomplete="off" placeholder="★ lover two">

            <button class="lt-btn" id="ltGo" type="button">♥ TEST LOVE ♥</button>
<div class="lt-note" id="ltNote"></div>
            <div class="lt-meter-wrap"><div class="lt-meter" id="ltMeter"></div></div>
            <div class="lt-pct" id="ltPct"></div>
            <div class="lt-hearts" id="ltHearts"></div>
          </div>

  <div class="lt-share" id="ltShare">
            <code id="ltShareText"></code>
            <div class="lt-actions">
              <button class="lt-copy" id="ltCopy" type="button">♥ copy to clipboard</button>
              <a class="lt-send" id="ltSend" href="#">♥ share to chatroom</a>
            </div>
          </div>
        </div>

        <p style="font-size:12px; color:#c77dff; margin-top:14px;">
          ★ ♥  ancient technology ♥ ★
        </p>

      </div>

      <div class="divider">★ ° ☆ ° ★ ° ☆ ° ★</div>

      <footer>
        ★ ° ☆ ° ★ ° ☆ ° ★ 2026 lily wakefield ★ ° ☆ ° ★ ° ☆ ° ★<br>
        <img src="/images/favicon.ico" alt="site icon" width="24" height="24">
        best experienced with an open heart
      </footer>

    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/vibeclock.js"></script>
<script>
  const aEl       = document.getElementById("ltA");
  const bEl       = document.getElementById("ltB");
  const goBtn     = document.getElementById("ltGo");
  const meterEl   = document.getElementById("ltMeter");
  const pctEl     = document.getElementById("ltPct");
  const heartsEl  = document.getElementById("ltHearts");
  const shareBox  = document.getElementById("ltShare");
  const shareText = document.getElementById("ltShareText");
  const copyBtn   = document.getElementById("ltCopy");
  const sendBtn   = document.getElementById("ltSend");
  const stage     = document.querySelector(".lt-stage");

  const HEART_ON  = "❤︎";
  const HEART_OFF = "❤";

  const RIGGED = {
    "juliet|romeo": 100,
    "dom|lily": 100,
    "dominic|lily": 100
  };

  function normalize(s) {
    return s.trim().toLowerCase().replace(/\s+/g, " ");
  }

  function pairKey(a, b) {
    return [a, b].sort().join("|");
  }

  function loveScore(a, b) {
    const na = normalize(a);
    const nb = normalize(b);

    if (na && na === nb) {
      return 100;
    }

    const rigged = RIGGED[pairKey(na, nb)];

    if (rigged !== undefined) {
      return rigged;
    }

    const combined = [na, nb].sort().join(HEART_ON);

    let h = 0x811c9dc5;

    for (let i = 0; i < combined.length; i++) {
      h ^= combined.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }

    return (h >>> 0) % 101;
  }

  function drawHearts(score) {
    const filled = Math.round(score / 10);

    let out = "";

    for (let i = 0; i < 10; i++) {
      if (i < filled) {
        out +=
          '<span class="on" style="animation-delay:' +
          (i * 0.09) +
          's">' +
          HEART_ON +
          "</span>";
      } else {
        out += '<span class="off">' + HEART_OFF + "</span>";
      }
    }

    heartsEl.innerHTML = out;
  }

  function rainHearts() {
    for (let i = 0; i < 12; i++) {
      const heart = document.createElement("span");

      heart.className = "float-heart";
      heart.textContent = HEART_ON;

      heart.style.left =
        (5 + Math.random() * 90) + "%";

      heart.style.animationDelay =
        (Math.random() * 0.5) + "s";

      heart.style.fontSize =
        (14 + Math.random() * 18) + "px";

      stage.appendChild(heart);

      setTimeout(function () {
        heart.remove();
      }, 2400);
    }
  }

  function shake(el) {
    el.classList.remove("shake");

    void el.offsetWidth;

    el.classList.add("shake");
  }

  drawHearts(0);

  let running = false;

  function runTest() {
    if (running) return;

    const a = aEl.value;
    const b = bEl.value;

    const na = normalize(a);
    const nb = normalize(b);

    if (!na || !nb) {
      if (!na) shake(aEl);
      if (!nb) shake(bEl);
      return;
    }

    running = true;
    goBtn.disabled = true;

    shareBox.classList.remove("on");
    heartsEl.innerHTML = "";

    pctEl.textContent = "0%";
    meterEl.style.width = "0%";

    const target = loveScore(a, b);

    let shown = 0;

    function step() {
      shown += Math.max(
        1,
        Math.ceil((target - shown) / 8)
      );

      if (shown >= target) {
        shown = target;
      }

      meterEl.style.width = shown + "%";
      pctEl.textContent = shown + "%";

      if (shown < target) {
        setTimeout(step, 28);
        return;
      }

      drawHearts(target);
      rainHearts();

      if (window.logLove) {
        window.logLove(na, nb, target);
      }

      shareText.textContent =
        HEART_ON +
        " " +
        na +
        " + " +
        nb +
        " = " +
        target +
        "% " +
        HEART_ON +
        " — tested at lilywakefield.com.au/lovetester.html";

      shareBox.classList.add("on");

      running = false;
      goBtn.disabled = false;
    }

    setTimeout(step, 450);
  }

  goBtn.addEventListener("click", runTest);

  aEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      bEl.focus();
    }
  });

  bEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      runTest();
    }
  });

  /* COPY RESULT */
  copyBtn.addEventListener("click", async function () {
    try {
      await navigator.clipboard.writeText(
        shareText.textContent
      );

      copyBtn.textContent = "✓ copied !!";
    } catch (e) {
      copyBtn.textContent =
        "select it & copy manually xx";
    }
  });

  /* SEND RESULT TO CHATROOM */
  sendBtn.addEventListener("click", function (e) {
    e.preventDefault();

    const message = shareText.textContent.trim();

    if (!message) {
      return;
    }

    const name = aEl.value.trim().slice(0, 40);

    const chatroomURL = new URL(
      "/chatroom.html",
      window.location.origin
    );

    chatroomURL.searchParams.set("name", name);
    chatroomURL.searchParams.set(
      "msg",
      message.slice(0, 300)
    );

    window.location.href = chatroomURL.toString();
  });
</script>
</body>
</html>
