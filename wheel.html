<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✧ the wheel of indecision ✧</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="css/site.css">
  <meta property="og:title" content="the wheel of indecision">
  <meta property="og:description" content="if you can't decide? let the wheel decide for you.">
  <meta property="og:type" content="website">
  <style>
    .wheel-wrap { text-align: center; }

    .wheel-stage {
      position: relative;
      width: min(420px, 88vw);
      margin: 0 auto 14px;
    }
    .wheel-stage canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(255,0,255,.5), 0 0 40px rgba(0,255,255,.3);
      background: #060022;
    }
    /* pointer */
    .wheel-ptr {
      position: absolute;
      top: -6px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 28px solid #ffe600;
      filter: drop-shadow(0 0 5px #ffe600);
      z-index: 3;
    }
    /* hub / spin button */
    .wheel-hub {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 76px; height: 76px;
      border-radius: 50%;
      background: linear-gradient(#ff00ff,#9900cc);
      border: 3px outset #ff00ff;
      color: #fff; font-family: "Comic Sans MS", cursive; font-weight: bold;
      font-size: 15px; cursor: pointer; z-index: 2;
      box-shadow: 0 0 12px #ff00ff;
    }
    .wheel-hub:hover { filter: brightness(1.15); }
    .wheel-hub:disabled { opacity: .7; cursor: wait; }

    .verdict {
      font-family: "Comic Sans MS", cursive;
      font-size: 22px; font-weight: bold;
      min-height: 30px; margin: 8px 0 16px;
      color: #fff;
      text-shadow: 2px 2px 0 #ff00ff, -1px -1px 0 #00ffff;
    }
    .verdict.pop { animation: vpop .5s ease; }
    @keyframes vpop { 0%{transform:scale(.4);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }

    .opts-box {
      max-width: 460px; margin: 0 auto;
      background-color: #0a0033;
      background-image:
        radial-gradient(rgba(255,255,255,.50) 1px, transparent 1px),
        radial-gradient(rgba(255,255,255,.50) 1px, transparent 1px);
      background-size: 30px 30px;
      background-position: 0 0, 11px 11px;
      animation: optsDots 7s linear infinite;
      border: 2px dashed #00ffff; padding: 14px; text-align: left;
    }
    @keyframes optsDots {
      from { background-position: 0 0, 11px 11px; }
      to   { background-position: 22px 22px, 33px 33px; }
    }
    .opts-title { font-family:"Courier New",monospace; font-size:12px; color:#ffff00; text-transform:uppercase; letter-spacing:2px; margin-bottom:8px; text-align:center; }
    .opt-line { display:flex; gap:6px; margin-bottom:6px; }
    .opt-line input {
      flex:1; font-family:"Comic Sans MS",cursive; font-size:14px;
      background:#001a2e; color:#00ffff; border:2px inset #00ffff; padding:6px;
    }
    .opt-line .rm {
      background:#400; color:#f66; border:1px solid #f66; cursor:pointer;
      font-family:"Courier New",monospace; font-weight:bold; padding:0 10px;
    }
    .opts-add {
      margin-top:6px; width:100%;
      background:linear-gradient(to bottom,#33ff00,#1c9900); color:#0f3eb5;
      border:2px outset #00ff88; font-family:"Comic Sans MS",cursive; font-weight:bold;
      padding:7px; cursor:pointer;
    }
    .opts-add:hover { filter:brightness(1.12); }

    .save-row {
      display:flex; gap:6px; margin-top:12px; padding-top:12px;
      border-top:2px dashed #ff00ff;
    }
    .save-row input {
      flex:1; font-family:"Comic Sans MS",cursive; font-size:14px;
      background:#2a0033; color:#ff9cf2; border:2px inset #ff00ff; padding:6px;
    }
    .save-row .save-btn {
      background:linear-gradient(to bottom,#ffe600,#ff9c00); color:#5a0072;
      border:2px outset #ffe600; font-family:"Comic Sans MS",cursive; font-weight:bold;
      padding:7px 12px; cursor:pointer; white-space:nowrap;
    }
    .save-row .save-btn:hover { filter:brightness(1.1); }
    .save-row .save-btn:disabled { opacity:.6; cursor:wait; }
    .save-msg {
      text-align:center; min-height:16px; margin-top:6px;
      font-family:"Courier New",monospace; font-size:12px; color:#ffe600; letter-spacing:1px;
    }

    .gallery-box {
      max-width:460px; margin:16px auto 0;
      background:#001a2e; border:2px dashed #ff00ff; padding:14px; text-align:left;
    }
    .gallery-list {
      display:flex; flex-direction:column; gap:6px;
      max-height:220px; overflow-y:auto;
    }
    .gallery-item {
      text-align:left; font-family:"Comic Sans MS",cursive; font-size:14px;
      background:linear-gradient(to bottom,#3aa8ff,#0f3eb5); color:#fff;
      border:2px outset #00ffff; padding:8px 10px; cursor:pointer;
      text-shadow:1px 1px 0 #060022;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .gallery-item:hover { filter:brightness(1.15); }
    .gallery-empty, .gallery-loading {
      font-family:"Courier New",monospace; font-size:12px; color:#00ffff;
      text-align:center; padding:8px;
    }

    .confetti { position: fixed; pointer-events: none; z-index: 9999; font-size: 20px;
      animation: cfall 1.2s ease-out forwards; }
    @keyframes cfall {
      from { opacity:1; transform: translate(0,0) rotate(0); }
      to   { opacity:0; transform: translate(var(--cx), 120px) rotate(360deg); }
    }
    .spin-stats{
  font-family:"times New roman",monospace; font-size:13px; letter-spacing:1px;
  color:#00ffff; text-transform:uppercase; margin:0 auto 16px;
  display:inline-flex; gap:10px; align-items:center;
  padding:6px 14px; background:#0a0033; border:2px ridge #ff00ff;
  box-shadow:0 0 10px rgba(255,0,255,.4);
}
.spin-stats b{ color:#ffe600; }
.spin-stats .sep{ color:#ff00ff; }
  </style>
</head>
<body>

  <div class="ticker"><span>✦ let the wheel decide ✦</span></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>

    <div class="frame">

      <div class="hero">
        <h1>✧ the wheel of indecision ✧</h1>
        <p class="blink">☆ give it a spin ☆</p>
      </div>

      <div class="divider">★ ° ☆ ° ★ ° ☆ ° ★</div>

      <div class="content wheel-wrap">

        <div class="wheel-stage">
          <div class="wheel-ptr"></div>
          <canvas id="wheel" width="440" height="440"></canvas>
          <button class="wheel-hub" id="spinBtn" type="button">SPIN</button>
        </div>

        <div class="verdict" id="verdict">&nbsp;</div>
        <div class="opts-box">
          <div class="opts-title">★ what are we spinning about? ★</div>
          <div id="optList"></div>
          <button class="opts-add" id="addOpt" type="button">+ add another option !!!</button>

          <div class="save-row">
            <input id="wheelTitle" type="text" maxlength="40" placeholder="name this wheel…">
            <button class="save-btn" id="saveWheel" type="button">★ save it ★</button>
          </div>
          <div class="save-msg" id="saveMsg">&nbsp;</div>
        </div>

        <div class="gallery-box">
          <div class="opts-title">★ explore other people's indecision ★</div>
          <div class="gallery-list" id="galleryList">
            <div class="gallery-loading">loading wheels…</div>
          </div>
        </div>

      </div>

      <div class="divider">★ ° ☆ ° ★ ° ☆ ° ★</div>

      <footer>
        ★ ° ☆ ° ★ ° ☆ ° ★ 2026 lily wakefield ★ ° ☆ ° ★ ° ☆ ° ★<br>
        <img src="/images/favicon.ico" alt="site icon" width="24" height="24">
        best experienced with an open heart
      </footer>

    </div>
  </div>

  <script src="/js/nav.js"></script>
  <script src="/js/effects.js"></script>

  <script>
    // 
    let options = ["have a nap", "eat some cheese", "study for equity exam", "touch grass", "make more of this stupid website", "go to the gym"];

    const COLORS = ["#ff5c8a","#ff9c00","#ffe600","#aaff00","#00ff88","#00ffcc","#3aa8ff","#9900cc","#c77dff","#ff00ff"];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const R = canvas.width / 2;
    let angle = 0;       
    let spinning = false;

    function draw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const n = options.length;
      const slice = (Math.PI * 2) / n;

      for (let i = 0; i < n; i++) {
        const start = angle + i * slice;
        ctx.beginPath();
        ctx.moveTo(R, R);
        ctx.arc(R, R, R - 4, start, start + slice);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "#060022"; ctx.stroke();

        // label
        ctx.save();
        ctx.translate(R, R);
        ctx.rotate(start + slice / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#0d0733";
        ctx.font = "bold 16px 'Comic Sans MS', cursive";
        const label = options[i].length > 16 ? options[i].slice(0,15) + "…" : options[i];
        ctx.fillText(label, R - 18, 6);
        ctx.restore();
      }

      // rim
      ctx.beginPath();
      ctx.arc(R, R, R - 4, 0, Math.PI * 2);
      ctx.lineWidth = 6; ctx.strokeStyle = "#ff00ff"; ctx.stroke();
    }

    const verdictEl = document.getElementById("verdict");
    const spinBtn = document.getElementById("spinBtn");

    function spin() {
      if (spinning || options.length < 2) return;
      spinning = true;
      spinBtn.disabled = true;
      verdictEl.textContent = "\u00a0";

      const spins = 5 + Math.random() * 4;                 // full turns
      const target = angle + spins * Math.PI * 2 + Math.random() * Math.PI * 2;
      const startA = angle;
      const dur = 4200 + Math.random() * 800;
      const t0 = performance.now();

      function frame(now) {
        const p = Math.min(1, (now - t0) / dur);
        const ease = 1 - Math.pow(1 - p, 3);               // ease-out cubic
        angle = startA + (target - startA) * ease;
        draw();
        if (p < 1) {
          requestAnimationFrame(frame);
        } else {
          spinning = false;
          spinBtn.disabled = false;
          announce();
        }
      }
      requestAnimationFrame(frame);
    }

    function announce() {
      const n = options.length;
      const slice = (Math.PI * 2) / n;
      const norm = ((angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      const pointer = (-Math.PI/2 - norm + Math.PI*2 * 2) % (Math.PI*2);
      const idx = Math.floor(pointer / slice) % n;
      const pick = options[idx];

      verdictEl.textContent = "★ " + pick + " ★";
      verdictEl.classList.remove("pop"); void verdictEl.offsetWidth; verdictEl.classList.add("pop");
      confetti();
      if (window.recordSpin) window.recordSpin();   
    }

    function confetti() {
      const chars = ["✦","✧","★","✨","💖","🎉"];
      const cx = window.innerWidth/2;
      for (let i=0;i<20;i++){
        const s=document.createElement("span");
        s.className="confetti"; s.textContent=chars[Math.floor(Math.random()*chars.length)];
        s.style.left=cx+"px"; s.style.top="40%";
        s.style.setProperty("--cx",(Math.random()*400-200)+"px");
        s.style.color=COLORS[Math.floor(Math.random()*COLORS.length)];
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),1200);
      }
    }

    spinBtn.addEventListener("click", spin);
    canvas.addEventListener("click", spin);

    // ── options editor ─────────────────────────────────────
    const optList = document.getElementById("optList");
    function renderOpts() {
      optList.innerHTML = "";
      options.forEach((opt, i) => {
        const line = document.createElement("div");
        line.className = "opt-line";
        const inp = document.createElement("input");
        inp.value = opt; inp.maxLength = 30;
        inp.addEventListener("input", () => { options[i] = inp.value; draw(); });
        const rm = document.createElement("button");
        rm.className = "rm"; rm.type = "button"; rm.textContent = "×";
        rm.title = "remove";
        rm.addEventListener("click", () => {
          if (options.length <= 2) return;   // need at least two to decide
          options.splice(i,1); renderOpts(); draw();
        });
        line.appendChild(inp); line.appendChild(rm);
        optList.appendChild(line);
      });
    }
    document.getElementById("addOpt").addEventListener("click", () => {
      if (options.length >= 12) return;      // keep it readable
      options.push("new option"); renderOpts(); draw();
    });

    renderOpts();
    draw();
  </script>

  <!-- ── save / load wheels to the shared gallery ───────────────── -->
  <script>
    (function () {
      const db     = firebase.firestore();
      const wheels = db.collection("wheels");

      const titleInput  = document.getElementById("wheelTitle");
      const saveBtn     = document.getElementById("saveWheel");
      const saveMsg     = document.getElementById("saveMsg");
      const galleryList = document.getElementById("galleryList");

      function flash(msg) {
        saveMsg.textContent = msg;
        clearTimeout(flash._t);
        flash._t = setTimeout(() => { saveMsg.innerHTML = "&nbsp;"; }, 3500);
      }

      function currentOptions() {
        return options.map(o => String(o).trim()).filter(Boolean);
      }

      function saveWheel() {
        const title = (titleInput.value || "").trim();
        const opts  = currentOptions();

        if (title.length < 2) { flash("give your wheel a name first!"); return; }
        if (opts.length < 2)  { flash("need at least two real options to save"); return; }

        // mirror the editor's own limits: ≤12 options, ≤30 chars each
        const clean = opts.slice(0, 12).map(o => o.slice(0, 30));

        saveBtn.disabled = true;
        flash("saving…");

        wheels.add({
          title: title.slice(0, 40),
          options: clean,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(() => {
          titleInput.value = "";
          flash("saved to the gallery! ✧");
          loadGallery();
        })
        .catch(err => {
          console.error(err);
          flash("couldn't save — try again?");
        })
        .finally(() => { saveBtn.disabled = false; });
      }

      function loadWheel(opts, title) {
        const clean = (opts || []).map(String).map(o => o.trim()).filter(Boolean);
        if (clean.length < 2) return;
        options = clean.slice(0, 12);   // reuse the page's global options array
        renderOpts();
        draw();
        verdictEl.textContent = "★ loaded: " + title + " ★";
        document.querySelector(".wheel-stage")
                .scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function loadGallery() {
        wheels.orderBy("createdAt", "desc").limit(60).get()
          .then(snap => {
            galleryList.innerHTML = "";
            if (snap.empty) {
              galleryList.innerHTML =
                '<div class="gallery-empty">no saved wheels yet — be the first! ☆</div>';
              return;
            }
            snap.forEach(doc => {
              const d = doc.data();
              const opts = d.options || [];
              if (!Array.isArray(opts) || opts.length < 2) return;
              const btn = document.createElement("button");
              btn.className = "gallery-item";
              btn.type = "button";
              btn.textContent = "▸ " + (d.title || "untitled") + "  (" + opts.length + ")";
              btn.title = "load this wheel";
              btn.addEventListener("click", () => loadWheel(opts, d.title || "untitled"));
              galleryList.appendChild(btn);
            });
          })
          .catch(err => {
            console.error(err);
            galleryList.innerHTML =
              '<div class="gallery-empty">couldn\'t load the gallery right now</div>';
          });
      }

      saveBtn.addEventListener("click", saveWheel);
      titleInput.addEventListener("keydown", e => { if (e.key === "Enter") saveWheel(); });

      loadGallery();
    })();
  </script>

  <script src="/js/wheelstats.js" defer></script>
